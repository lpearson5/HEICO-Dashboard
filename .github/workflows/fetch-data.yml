name: Fetch EDGAR Data

on:
  schedule:
    # 11:00 UTC daily = ~6-7am Eastern. Refreshes the dashboard every day;
    # the Monday run also finishes well before the 8am ET weekly email.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch institutional ownership from EDGAR
        run: node scripts/fetch-edgar.mjs

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hei.json data/heia.json data/scan-cache.json
          if ! git diff --cached --quiet; then
            hei=$(node -e "console.log(require('./data/hei.json').holdings.filter(h=>h.currentShares!=null).length)")
            heia=$(node -e "console.log(require('./data/heia.json').holdings.filter(h=>h.currentShares!=null).length)")
            date=$(date -u +%Y-%m-%d)
            git commit -m "HEICO 13F data refreshed $date - HEI $hei holders, HEI.A $heia holders"
            git push
            echo "Data changed and pushed."
          else
            echo "No data change."
          fi
