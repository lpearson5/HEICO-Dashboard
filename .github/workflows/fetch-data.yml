name: Fetch EDGAR Data

on:
  schedule:
    # 11:00 UTC daily = ~6-7am Eastern. Refreshes the dashboard every day;
    # the Monday run also finishes well before the 8am ET weekly email.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch institutional ownership from EDGAR
        run: node scripts/fetch-edgar.mjs

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hei.json data/heia.json data/scan-cache.json data/alerts-sent.json data/monthly-hei.json data/monthly-heia.json data/funds-hei.json data/funds-heia.json data/nport-cache.json
          if ! git diff --cached --quiet; then
            date=$(date -u +%Y-%m-%d)
            # If the script flagged new large moves, lead the commit (and thus the
            # RSS-triggered alert email) with an [ALERT] marker carrying the summary.
            if [ -s new-alerts.txt ]; then
              msg="[ALERT] $(cat new-alerts.txt)"
            else
              hei=$(node -e "console.log(require('./data/hei.json').holdings.filter(h=>h.currentShares!=null).length)")
              heia=$(node -e "console.log(require('./data/heia.json').holdings.filter(h=>h.currentShares!=null).length)")
              msg="HEICO 13F data refreshed $date - HEI $hei holders, HEI.A $heia holders"
            fi
            git commit -m "$msg"
            git push
            echo "Data changed and pushed: $msg"
          else
            echo "No data change."
          fi
