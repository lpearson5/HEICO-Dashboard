name: Fetch EDGAR Data

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      send_email_anyway:
        description: "Send the notification email even if the data did not change (for testing)"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 720
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch institutional ownership from EDGAR
        shell: powershell
        run: node scripts/fetch-edgar.mjs

      - name: Commit updated data files
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://lpearson5:$env:GH_PAT@github.com/lpearson5/HEICO-Dashboard.git"
          git add data/hei.json data/heia.json data/scan-cache.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $date = Get-Date ([datetime]::UtcNow) -Format 'yyyy-MM-dd'
            git commit -m "chore: refresh EDGAR 13F data $date"
            git push
            "DATA_CHANGED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Data changed - notification will be sent."
          } else {
            Write-Host "No data change - skipping notification."
          }

      - name: Notify via Power Automate
        if: env.DATA_CHANGED == 'true' || github.event.inputs.send_email_anyway == 'true'
        shell: powershell
        continue-on-error: true
        env:
          FLOW_URL: ${{ secrets.FLOW_URL }}
        run: |
          $hei  = Get-Content data/hei.json  -Raw | ConvertFrom-Json
          $heia = Get-Content data/heia.json -Raw | ConvertFrom-Json
          $payload = @{
            date       = (Get-Date ([datetime]::UtcNow) -Format 'MMMM d, yyyy')
            url        = "https://heico-dashboard.vercel.app"
            heiPeriod  = $hei.currentPeriod
            heiCount   = ($hei.holdings  | Where-Object { $null -ne $_.currentShares }).Count
            heiaPeriod = $heia.currentPeriod
            heiaCount  = ($heia.holdings | Where-Object { $null -ne $_.currentShares }).Count
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:FLOW_URL -Method Post -Body $payload -ContentType "application/json"
          Write-Host "Notification posted to Power Automate."
