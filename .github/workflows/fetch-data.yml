name: Fetch EDGAR Data

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 720
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch institutional ownership from EDGAR
        shell: powershell
        run: node scripts/fetch-edgar.mjs

      - name: Commit updated data files
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://lpearson5:$env:GH_PAT@github.com/lpearson5/HEICO-Dashboard.git"
          git add data/hei.json data/heia.json data/scan-cache.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $hei  = Get-Content data/hei.json  -Raw | ConvertFrom-Json
            $heia = Get-Content data/heia.json -Raw | ConvertFrom-Json
            $heiCur  = ($hei.holdings  | Where-Object { $null -ne $_.currentShares }).Count
            $heiaCur = ($heia.holdings | Where-Object { $null -ne $_.currentShares }).Count
            $date = Get-Date ([datetime]::UtcNow) -Format 'yyyy-MM-dd'
            # Commit message carries the counts so the RSS-triggered email can show them.
            git commit -m "HEICO 13F data refreshed $date - HEI $heiCur holders, HEI.A $heiaCur holders"
            git push
            Write-Host "Data changed and pushed."
          } else {
            Write-Host "No data change - nothing pushed, no email will fire."
          }
