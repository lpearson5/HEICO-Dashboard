name: Fetch EDGAR Data

on:
  schedule:
    # 11:00 UTC daily = ~6-7am Eastern. Refreshes the dashboard every day;
    # the Monday run also finishes well before the 8am ET weekly email.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch institutional ownership from EDGAR
        run: |
          node scripts/fetch-edgar.mjs
          node scripts/fetch-options.mjs
          node scripts/fetch-geography.mjs
          node scripts/fetch-prices.mjs
          node scripts/fetch-short-interest.mjs
          node scripts/fetch-fundamentals.mjs
          node scripts/fetch-earnings.mjs
          node scripts/classify-investors.mjs
          node scripts/self-audit.mjs

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hei.json data/heia.json data/scan-cache.json data/alerts-sent.json data/monthly-hei.json data/monthly-heia.json data/funds-hei.json data/funds-heia.json data/nport-cache.json data/beneficial-owners.json data/peers.json data/peer-cache.json data/prices.json data/geography-hei.json data/geography-heia.json data/geo-cache.json data/short-interest.json data/fundamentals.json data/earnings.json data/options.json data/investor-styles.json data/self-audit.json
          if ! git diff --cached --quiet; then
            date=$(date -u +%Y-%m-%d)
            # Lead the commit (and thus the RSS-triggered alert email) with an
            # [ALERT] marker when the pipeline flagged new large moves OR the
            # self-audit found a data-integrity problem — so both reach the inbox.
            alert=""
            [ -s new-alerts.txt ] && alert="$(cat new-alerts.txt)"
            if [ -s audit-findings.txt ]; then
              alert="${alert:+$alert | }DATA AUDIT: $(head -1 audit-findings.txt)"
            fi
            if [ -n "$alert" ]; then
              msg="[ALERT] $alert"
            else
              hei=$(node -e "console.log(require('./data/hei.json').holdings.filter(h=>h.currentShares!=null).length)")
              heia=$(node -e "console.log(require('./data/heia.json').holdings.filter(h=>h.currentShares!=null).length)")
              msg="HEICO 13F data refreshed $date - HEI $hei holders, HEI.A $heia holders (audit OK)"
            fi
            git commit -m "$msg"
            git push
            echo "Data changed and pushed: $msg"
          else
            echo "No data change."
          fi
